# Runs once per pull request update to main, never on push: main only changes through merged PRs.
# Each check runs on one OS only: the full gate without a denylist on Linux (tests, control, sweep,
# sweep control), the test suite alone on macOS and Windows. The denylist and `claude` legs stay
# local (scripts/gate.py --release), so this workflow uses no secrets.
name: test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -I scripts/gate.py --out "${{ runner.temp }}/gate"
      - if: failure()
        run: tail -n 300 "${{ runner.temp }}/gate/tests.log"
      - name: hook latency
        continue-on-error: true
        timeout-minutes: 15
        run: python -I -X utf8 scripts/hook_latency.py --runs 20

  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -I -X utf8 scripts/run_tests.py --no-claude
      - name: startup bench
        continue-on-error: true
        run: python -I -X utf8 scripts/startup_bench.py --runs 20
      - name: hook latency
        continue-on-error: true
        timeout-minutes: 15
        run: python -I -X utf8 scripts/hook_latency.py --runs 20
